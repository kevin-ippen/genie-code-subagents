command:
  - sh
  - -c
  - "uvicorn server:app --host 0.0.0.0 --port $DATABRICKS_APP_PORT --workers 1"
env:
  - name: DEFAULT_MODEL
    value: "databricks-gemini-3-5-flash"
  - name: MODEL_GEMINI_FLASH_ENDPOINT
    value: "databricks-gemini-3-5-flash"
  - name: MODEL_GPT_5_6_ENDPOINT
    value: "databricks-gpt-5-6-terra"
  - name: MODEL_CLAUDE_SONNET_ENDPOINT
    value: "databricks-claude-sonnet-5"
  - name: MODEL_LLAMA_MAVERICK_ENDPOINT
    value: "databricks-llama-4-maverick"
  - name: DEFAULT_CONCURRENCY
    value: "10"
  - name: DEFAULT_MAX_TOKENS
    value: "1024"
  - name: BROWSER_LIBS_PATH
    value: "/app/python/source_code/libs"
